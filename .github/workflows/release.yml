name: Release

# Fires on a version tag (vX.Y.Z) to build, sign, and publish a GitHub Release.
# workflow_dispatch runs a dry build (artifacts uploaded to the run, no Release created).
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for a manual dry-run build (e.g. 0.0.1)'
        required: true
        default: '0.0.1'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # Derive both the semver (X.Y.Z, for filenames) and the 4-part MSIX version (X.Y.Z.0).
      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "semver=$V"   >> "$GITHUB_OUTPUT"
          echo "msix=$V.0"   >> "$GITHUB_OUTPUT"

      - name: Restore & test (gate the release on green tests)
        run: |
          dotnet restore EdMd.slnx
          dotnet test EdMd.slnx -c Release

      # ---- Portable self-contained single-file exe (+ a zipped copy) ----
      - name: Publish portable exe
        shell: pwsh
        run: |
          dotnet publish src/EdMd/EdMd.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:Version=${{ steps.ver.outputs.msix }} -o publish/exe
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item publish/exe/EdMd.exe "dist/EdMd-${{ steps.ver.outputs.semver }}-win-x64.exe"
          # Portable zip: the exe under its plain name plus the license, for users/orgs that
          # prefer a zipped download over a bare .exe (avoids some SmartScreen/AV friction).
          $stage = 'publish/portable'
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item publish/exe/EdMd.exe "$stage/EdMd.exe"
          Copy-Item LICENSE "$stage/LICENSE.txt"
          Compress-Archive -Path "$stage/*" `
            -DestinationPath "dist/EdMd-${{ steps.ver.outputs.semver }}-win-x64.zip" -Force

      # ---- MSIX: sign with the committed self-signed cert via a secret ----
      # Reuses the installer's production path. The cert is shipped alongside the release so
      # users can trust it once (see the README); moving to a publicly-trusted certificate
      # later would remove that step.
      - name: Build & self-sign MSIX
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.SELFSIGN_PFX_BASE64 }}
          PFX_PWD: ${{ secrets.SELFSIGN_PFX_PASSWORD }}
        run: |
          if (-not $env:PFX_B64) { throw "SELFSIGN_PFX_BASE64 secret is not set." }
          $pfx = Join-Path $env:RUNNER_TEMP 'edmd-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_B64))
          ./src/EdMd.Installer/build.ps1 -PfxPath $pfx -PfxPassword $env:PFX_PWD -Version ${{ steps.ver.outputs.msix }}
          Remove-Item $pfx -Force
          Copy-Item "src/EdMd.Installer/Output/EdMd-${{ steps.ver.outputs.msix }}.msix" dist/
          Copy-Item certs/edmd-codesign.cer dist/   # so users can trust the signing cert

      # ---- SBOM (CycloneDX 1.7) ----
      # Ships with the release so the published binaries can be audited for vulnerable or
      # awkwardly-licensed dependencies. Written into dist/ so it rides along with the
      # existing `files: dist/*` upload (and the dry-run artifact upload below).
      # NOTE: --spec-version picks the CycloneDX version; the similar-looking -sv is
      # --set-version (the metadata component version). Don't swap them.
      - name: Install CycloneDX tool
        run: dotnet tool install --global CycloneDX

      - name: Generate SBOM
        shell: pwsh
        run: |
          dotnet CycloneDX EdMd.slnx --spec-version 1.7 --output-format Json `
            --set-name EdMd --set-version ${{ steps.ver.outputs.semver }} --output sbom
          if (-not (Test-Path sbom/bom.json)) { throw "CycloneDX produced no bom.json." }
          Copy-Item sbom/bom.json "dist/EdMd-${{ steps.ver.outputs.semver }}-sbom.cdx.json"

      # ---- Publish ----
      - name: Create GitHub Release (tag builds only)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true

      - name: Upload dry-run artifacts (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: edmd-${{ steps.ver.outputs.semver }}
          path: dist/*
