name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    # Windows-only: WPF + WebView2. The tests themselves (LocalWebServer, AtomicFile)
    # are pure C# and need no WebView2 runtime.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore EdMd.slnx

      - name: Build
        run: dotnet build EdMd.slnx -c Release --no-restore

      - name: Test
        run: dotnet test EdMd.slnx -c Release --no-build

      # ---- SBOM (CycloneDX 1.7) ----
      # A software bill of materials for the whole solution, published with the run so a
      # build can be audited for vulnerable/licensed dependencies after the fact.
      # NOTE: --spec-version picks the CycloneDX version; the similar-looking -sv is
      # --set-version (the metadata component version). Don't swap them.
      - name: Install CycloneDX tool
        run: dotnet tool install --global CycloneDX

      - name: Generate SBOM
        run: >
          dotnet CycloneDX EdMd.slnx
          --spec-version 1.7
          --output-format Json
          --set-name EdMd
          --set-version ${{ github.sha }}
          --output sbom

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-cyclonedx-1.7
          path: sbom/bom.json
          if-no-files-found: error
